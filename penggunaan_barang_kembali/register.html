<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penggunaan Barang Kembali - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginPage" class="login-page">
    <div class="login-illustration">
      <div class="brand-mark">↻</div>
      <h1>Penggunaan Barang Kembali</h1>
      <p>Gunakan kembali, beri manfaat<br>untuk bersama.</p>
      <div class="illustration-box">♻︎</div>
    </div>
    <div class="login-card">
      <span class="eyebrow">SELAMAT DATANG</span>
      <form action="register.php" method="POST">
      <h2>Registrasi Akun</h2>
      <p class="muted">Khusus mahasiswa Politeknik Negeri Batam.</p>
        <label>Nama Lengkap</label>
        <input type="text" name="namalengkap" placeholder="Masukkan Nama Lengkap" required>
        <label>Email atau NIM</label>
        <input type="text" name="emailnim" placeholder="Masukkan email atau NIM" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Masukkan password" name="password" required>
        <label>Ulangi Password</label>
        <input type="password" name="ulangipassword" placeholder="Ulangi Password" name="ulangipassword" required>
        <button class="primary-btn" type="submit" id="btn">Masuk</button>
        <p id="error" style="color: red;"></p>
        <p class="login-note">Sudah punya akun?
          <a href="login.html" id="registerLink">Login di sini</a></p>
          <div class="divider"><span>atau</span></div>
          <p class="demo-button">
            <a href="dashboard.html">Masuk Sebagai Demo</a>
          </p>
        </div>
      </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
